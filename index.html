<!DOCTYPE html>
<html>
<head>
    <title>Task Reminder App</title>
    <style>
        body { font-family: Arial; padding: 40px; background: #f4f4f9; }
        .box { background: white; padding: 20px; border-radius: 8px; width: 300px; margin: auto; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Set a Reminder</h2>
        <form id="form">
            <input type="text" id="taskName" placeholder="Task Name (e.g., Buy Milk)" required>
            <input type="datetime-local" id="reminderTime" required>
            <select id="notificationType">
                <option value="email">Email</option>
                <option value="sms">SMS</option>
            </select>
            <button type="submit">Set Reminder</button>
        </form>
        <p id="result" style="color: green; font-weight: bold;"></p>
    </div>

    <script>
        document.getElementById('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                taskName: document.getElementById('taskName').value,
                reminderTime: document.getElementById('reminderTime').value.replace('T', ' '),
                notificationType: document.getElementById('notificationType').value
            };

            const res = await fetch('/api/reminder', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            document.getElementById('result').textContent = result.message;
        });
    </script>
</body>
</html>
